services:
  - type: web
    name: fashion-2-backend
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: fashion-2-data
      mountPath: /app/data
      sizeGB: 1
