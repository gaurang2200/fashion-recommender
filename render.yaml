services:
  # Backend FastAPI Web Service
  - type: web
    name: fashion-2-backend
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: fashion-2-data
      mountPath: /app/data
      sizeGB: 1

  # Frontend React Static Site
  - type: web
    name: fashion-2-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fashion-2-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
